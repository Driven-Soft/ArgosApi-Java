spring.application.name=ArgosApi

# Porta
server.port=${PORT:8080}

# H2 (desenvolvimento)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:argosdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# APIs externas
weather.api.base-url=https://api.open-meteo.com/v1/forecast
nasa.api.key=${NASA_API_KEY:DEMO_KEY}

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# JWT
jwt.secret=${JWT_SECRET:argos_secret_key_change_this_in_production_1234567890abcdef}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
